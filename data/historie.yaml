# Historie – BEISPIELEINTRÄGE. Ersetze sie durch deine echten Daten.
#
# km_stand: abgelesene km-Stände
#   datum: yyyy-mm-dd (oder dd.mm.yyyy in Anführungszeichen)
#   km:    ganze Zahl
#
# services: ausgeführte Wartungen
#   position:   Name genau wie in wartungsplan.yaml (Gross/klein egal)
#   datum:      yyyy-mm-dd
#   km:         optional (empfohlen), wird auch als km-Stand übernommen
#   wer:        optional, z.B. selbst oder Name der Werkstatt
#   kosten_chf: optional, z.B. 45 oder 45.50
#   notiz:      optional
#
# Beim Start werden nur neue Einträge übernommen. Duplikat = gleiche Position + Datum + km.
# Einträge, die nicht passen (km sinkt, unbekannte Position), stehen im Log und werden übersprungen.

km_stand:
